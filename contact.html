    <!-- Hero (Smaller) -->
    <header class="hero small-hero">
        <h1>Contact Me</h1>
        <p class="tagline">Open to roles in Full Stack Development, Data Analytics, and UI/UX.</p>
    </header>

    <section class="section contact-section">
        <div class="contact-details">
            <h2>Contact Details</h2>
            <ul class="list">
                <li><strong>Phone:</strong> +1 (945) 335-4842</li>
                <li><strong>Email:</strong> rohanchowdary9999@gmail.com</li>
                <li><strong>Location:</strong> Denton, TX, USA</li>
            </ul>

         

        <div class="contact-form-wrapper">
            <h2>Send a Message</h2>
            <!-- Front-end only form; no backend submission required for class -->
            <form class="contact-form">
                <label for="name">Name</label>
                <input type="text" id="name" placeholder="Your Name">

                <label for="email">Email</label>
                <input type="email" id="email" placeholder="Your Email">

                <label for="message">Message</label>
                <textarea id="message" rows="5" placeholder="Write your message here..."></textarea>

                <button type="submit">Submit</button>
            </form>

              </div>
    </section>
